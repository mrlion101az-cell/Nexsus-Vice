# NexusVice configuration
#
# Every substance/alcohol display-name below is exactly what players see
# in item names and chat messages. Change any of them and reload (or
# restart) -- nothing in the plugin's code needs to change. The internal
# keys (fentinoli, xanaxel, etc.) are just lookup keys, not shown to
# players anywhere.

tick-interval-seconds: 5
decay-per-tick: 3.0

vomit:
  severe-chance: 0.3
  overdose-chance: 1.0
  cooldown-seconds: 30

blackout:
  alcohol-threshold: 90.0
  damage-per-pulse: 2.0
  pulse-interval-seconds: 5

combo:
  # depressant substances taken alongside alcohol accelerate faster than either alone
  depressant-alcohol-bonus-multiplier: 1.5

rehab:
  cooldown-hours: 24

substances:
  fentinoli:
    display-name: "Fentinoli"
    dose-per-item: 40
    overdose-threshold: 55
    has-overdose-risk: true
  xanaxel:
    display-name: "Xanaxel"
    dose-per-item: 30
    overdose-threshold: 80
    has-overdose-risk: true
  opiatrix:
    display-name: "Opiatrix"
    dose-per-item: 35
    overdose-threshold: 65
    has-overdose-risk: true
  molotine:
    display-name: "Molotine"
    dose-per-item: 30
    overdose-threshold: 90
    has-overdose-risk: false
  cocainium:
    display-name: "Cocainium"
    dose-per-item: 35
    overdose-threshold: 100
    has-overdose-risk: false
  mollyq:
    display-name: "Molly-Q"
    dose-per-item: 30
    overdose-threshold: 100
    has-overdose-risk: false
  acidrop:
    display-name: "Acidrop"
    dose-per-item: 25
    overdose-threshold: 999999
    has-overdose-risk: false
  herbalis:
    display-name: "Herbalis"
    dose-per-item: 15
    overdose-threshold: 200
    has-overdose-risk: false

alcohol:
  beer:
    display-name: "Beer"
    dose-per-item: 8
  wine:
    display-name: "Wine"
    dose-per-item: 18
  liquor:
    display-name: "Liquor"
    dose-per-item: 35
